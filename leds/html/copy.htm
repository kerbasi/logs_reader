<html>
<title>test js copy</title>
<body>
<script>
function copy(copy_id) {
 console.log(copy_id);
 const element = document.querySelector("#" + copy_id);
 const storage = document.createElement('textarea');
 storage.value = element.innerHTML;
 element.appendChild(storage);
 storage.select();
 document.execCommand("copy");
 element.removeChild(storage);
}
</script>
<p id="e1" onclick="copy('e1')">sample text 1</p>

<div id="e2" onclick="copy('e2')">SAMPLE text 2</div>

</body>
</html>
