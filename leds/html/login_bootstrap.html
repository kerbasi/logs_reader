<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Web Manager Lite</title>
	<link href="http://flex-iis/WebManager/Content/bootstrap.css" rel="stylesheet"/>	
	<link rel="stylesheet" href="http://flex-iis/WebManager/FontAwesome/all.css">
</head>
<body>
<style>
html {
 position: relative;
 min-height: 100%;
 padding-top: 40px;
 background-color: #eee;
}
body {
 margin-bottom: 60px;
}
.footer {
 position: absolute;
 bottom: 0;
 width: 100%;
 height: 60px;
 background-color: #f5f5f5;
}

.form-signin {
 max-width: 330px;
 padding: 15px;
 margin: 0 auto;
}
.form-signin .form-signin-heading,
.form-signin .checkbox {
margin-bottom: 10px;
}
.form-signin .checkbox {
 font-weight: 400;
}
.form-signin .form-control {
 position: relative;
 -webkit-box-sizing: border-box;
 -moz-box-sizing: border-box;
 box-sizing: border-box;
 height: auto;
 padding: 10px;
 font-size: 16px;
}
.form-signin .form-control:focus {
 z-index: 2;
}
.form-signin input[type="email"] {
 margin-bottom: -1px;
 border-bottom-right-radius: 0;
 border-bottom-left-radius: 0;
}
.form-signin input[type="password"] {
 margin-bottom: 10px;
 border-top-right-radius: 0;
 border-top-left-radius: 0;
}
</style>
<div class="container" role="main">

<form class="form-signin">
 <h2 class="form-signin-heading">Please sign in</h2>
 <label for ="inputEmail" class="sr-only">Email</label>
 <input type="email" id="inputEmail" class="form-control" placeholder="Email address" required autofocus>
 <label for ="inputPassword" class="sr-only">Password</label>
 <input type="password" id="inputPassword" class="form-control" placeholder="Password" required>
 <div class="checkbox">
  <label>
   <input type="checkbox" value="remember-me"> Remember me
  </label>
 </div>
 <button class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
</form>
 

</div>
<footer class="footer">
 <div class="container">
  <p class="text-muted">dbsjsahkbdhj sjdhgjhasg sgdfhjadg jh</p>
 </div>
</footer>
</body>
</html>
