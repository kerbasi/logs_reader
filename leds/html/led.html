<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LED photos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: #fff;
    }
    h1 {
      padding: 12px;
      margin: 0;
      font-size: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      padding: 12px;
    }
    .card {
      background: #222;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .card:hover {
      transform: scale(1.03);
    }
    .card img {
      width: 100%;
      height: 160px;
      object-fit: scale-down;
      display: block;
    }
    .name {
      font-size: 12px;
      padding: 6px;
      word-break: break-all;
      color: #bbb;
    }

    .name.error {
      color: #ff6b6b;
      font-weight: 800;
    }

    /* Fullscreen overlay */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: zoom-out;
    }
    .overlay img {
      max-width: 95%;
      max-height: 95%;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <h1>LED</h1>
  <div class="grid" id="gallery"></div>

  <!-- Fullscreen overlay -->
  <div class="overlay" id="overlay">
    <img id="overlayImg" src="" alt="" />
  </div>

  <script>
    // Array of image file paths
    const images = [
      "/usr/log/HIPPO_CAM_LED/202508/IMG/532X6387330039_HIPPO_CAM_LED_20250811_12.18.23_flexct251/ETH_LINK_GREEN.jpg",
      "/usr/log/HIPPO_CAM_LED/202508/IMG/532X6387330039_HIPPO_CAM_LED_20250811_12.18.23_flexct251/LEFT_REF_Images.jpg",
      "/usr/log/HIPPO_CAM_LED/202508/IMG/532X6387330039_HIPPO_CAM_LED_20250811_12.18.23_flexct251/LINK5_GREEN_ERROR.jpg",
      "/usr/log/HIPPO_CAM_LED/202508/IMG/532X6387330039_HIPPO_CAM_LED_20250811_12.18.23_flexct251/LINK5_GREEN.jpg",
    ];

    const gallery = document.getElementById("gallery");
    const overlay = document.getElementById("overlay");
    const overlayImg = document.getElementById("overlayImg");

    // Build grid
    images.forEach(path => {
      const card = document.createElement("div");
      card.className = "card";

      const img = document.createElement("img");
      img.src = path;
      img.alt = path.split("/").pop();

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = path;

      if (path.includes("ERROR")) {
        name.classList.add("error");
      }

      card.appendChild(img);
      card.appendChild(name);
      gallery.appendChild(card);

      // Click -> open fullscreen
      card.addEventListener("click", () => {
        overlayImg.src = path;
        overlay.style.display = "flex";
      });
    });

    // Close overlay on click or ESC
    overlay.addEventListener("click", () => {
      overlay.style.display = "none";
      overlayImg.src = "";
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        overlay.style.display = "none";
        overlayImg.src = "";
      }
    });
  </script>
</body>
</html>
